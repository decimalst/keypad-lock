<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Keypad lock architecture">
<rect width="1600" height="1000" fill="#0b1220"/>
<text x="64" y="64.4" fill="#73e0bf" font-family="Arial, sans-serif" font-size="20" font-weight="700">KEYPAD LOCK / LIVE RUST TRANSCRIPT</text>
<text x="64" y="146.56" fill="#eef4fc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Watch the policy do the work.</text>
<text x="64" y="201.32" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="26" font-weight="400">A reproducible host simulation. No hardware. No sleeps. No PIN logging.</text>
