<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Keypad lock architecture">
<rect width="1600" height="1000" fill="#0b1220"/>
<text x="64" y="64.4" fill="#73e0bf" font-family="Arial, sans-serif" font-size="20" font-weight="700">DECIMALST  /  RUST SYSTEMS</text>
<text x="64" y="149.2" fill="#eef4fc" font-family="Arial, sans-serif" font-size="60" font-weight="700">A small lock. Explicit boundaries.</text>
<text x="64" y="209.78" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="29" font-weight="400">Deterministic decisions in Rust. Hardware effects at the edge.</text>
<rect x="64" y="247" width="192" height="46" rx="18" fill="#14283a" stroke="#2b3b52" stroke-width="2"/>
<text x="82" y="276.22" fill="#84baff" font-family="Arial, sans-serif" font-size="21" font-weight="400">Rust 2024</text>
<rect x="280" y="247" width="158" height="46" rx="18" fill="#14283a" stroke="#2b3b52" stroke-width="2"/>
<text x="298" y="276.22" fill="#84baff" font-family="Arial, sans-serif" font-size="21" font-weight="400">no_std</text>
<rect x="462" y="247" width="272" height="46" rx="18" fill="#14283a" stroke="#2b3b52" stroke-width="2"/>
<text x="480" y="276.22" fill="#84baff" font-family="Arial, sans-serif" font-size="21" font-weight="400">No heap in core</text>
<rect x="757" y="247" width="190" height="46" rx="18" fill="#14283a" stroke="#2b3b52" stroke-width="2"/>
<text x="775" y="276.22" fill="#84baff" font-family="Arial, sans-serif" font-size="21" font-weight="400">No unsafe</text>
<rect x="64" y="363" width="350" height="252" rx="18" fill="#121e30" stroke="#2b3b52" stroke-width="2"/>
<text x="90" y="404.76" fill="#84baff" font-family="Arial, sans-serif" font-size="18" font-weight="700">01 / INPUT ADAPTER</text>
<text x="90" y="461.7" fill="#eef4fc" font-family="Arial, sans-serif" font-size="35" font-weight="700">Events</text>
<text x="90" y="506.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Keypad  ·  submit  ·  clear</text>
<text x="90" y="546.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Debounced door sensor</text>
<text x="90" y="586.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Monotonic elapsed time</text>
<rect x="518" y="341" width="536" height="296" rx="18" fill="#102c31" stroke="#448d80" stroke-width="2"/>
<text x="546" y="382.76" fill="#73e0bf" font-family="Arial, sans-serif" font-size="18" font-weight="700">02 / PURE RUST CORE</text>
<text x="546" y="435.6" fill="#eef4fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">SecurityState::next(event)</text>
<text x="546" y="484.86" fill="#73e0bf" font-family="Arial, sans-serif" font-size="23" font-weight="400">Current state → next state + actions</text>
<polyline points="546,510 1026,510" fill="none" stroke="#315c60" stroke-width="3"/>
<text x="546" y="557.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">PIN policy  ·  retry budget  ·  timers</text>
<text x="546" y="597.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Bounded buffers  ·  zeroized secrets</text>
<rect x="1158" y="363" width="378" height="252" rx="18" fill="#121e30" stroke="#2b3b52" stroke-width="2"/>
<text x="1184" y="404.76" fill="#84baff" font-family="Arial, sans-serif" font-size="18" font-weight="700">03 / OUTPUT EXECUTOR</text>
<text x="1184" y="461.7" fill="#eef4fc" font-family="Arial, sans-serif" font-size="35" font-weight="700">Actions</text>
<text x="1184" y="506.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Bolt  ·  alarm  ·  display</text>
<text x="1184" y="546.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Apply only output changes</text>
<text x="1184" y="586.86" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="23" font-weight="400">Sync all outputs on boot</text>
<polyline points="414,489 505,489" fill="none" stroke="#73e0bf" stroke-width="3"/>
<polygon points="505,489 493,482 493,496" fill="#73e0bf"/>
<polyline points="1054,489 1145,489" fill="none" stroke="#73e0bf" stroke-width="3"/>
<polygon points="1145,489 1133,482 1133,496" fill="#73e0bf"/>
<text x="431" y="470.76" fill="#73e0bf" font-family="Arial, sans-serif" font-size="18" font-weight="400">Event</text>
<text x="1067" y="470.76" fill="#73e0bf" font-family="Arial, sans-serif" font-size="18" font-weight="400">Action</text>
<polyline points="786,637 786,711" fill="none" stroke="#73e0bf" stroke-width="3"/>
<polygon points="786,711 779,699 793,699" fill="#73e0bf"/>
<rect x="518" y="724" width="1018" height="140" rx="18" fill="#121e30" stroke="#2b3b52" stroke-width="2"/>
<text x="546" y="762.76" fill="#ffcf83" font-family="Arial, sans-serif" font-size="18" font-weight="700">PERSISTENCE BOUNDARY</text>
<text x="546" y="808.14" fill="#eef4fc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Snapshot + PasscodeSealer → platform storage</text>
<text x="546" y="846.22" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="21" font-weight="400">Adapter owns encryption, metadata authentication and anti-rollback.</text>
<text x="64" y="754.42" fill="#eef4fc" font-family="Arial, sans-serif" font-size="31" font-weight="700">Same core.</text>
<text x="64" y="794.32" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="26" font-weight="400">Host simulation.</text>
<text x="64" y="832.32" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="26" font-weight="400">Embedded integration.</text>
<polyline points="64,914 1536,914" fill="none" stroke="#2b3b52" stroke-width="3"/>
<text x="64" y="961.04" fill="#a4b5cc" font-family="Arial, sans-serif" font-size="22" font-weight="400">github.com/decimalst/keypad-lock</text>
<text x="1060" y="956.94" fill="#73e0bf" font-family="Arial, sans-serif" font-size="17" font-weight="700">LOGIC DEMO / HARDWARE NOT INCLUDED</text>
</svg>